<!doctype html>
<html lang="ko" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Widgets · 미니멀 위젯 팩</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#F4EEE3; --win:#FFFDF8; --bar:#FAF4E8; --ink:#2A2721; --muted:#8A8376; --line:#EADFCD;
    --accent:#AD7949; --accent2:#6E8F6A; --soft:#F4EBDC;
  }
  html[data-theme="sage"]{--bg:#E9EFE6;--win:#FDFEFB;--bar:#F2F7F0;--ink:#243026;--muted:#78897C;--line:#D9E5D7;--accent:#4F8261;--accent2:#8FB295;--soft:#E6F0E2}
  html[data-theme="navy"]{--bg:#0C1220;--win:#141C2B;--bar:#19222F;--ink:#E9EEF7;--muted:#8492A8;--line:#27324A;--accent:#7FA1FF;--accent2:#45CEB0;--soft:#1D2739}
  html[data-theme="blush"]{--bg:#FAEEEF;--win:#FFFCFC;--bar:#FDF2F3;--ink:#33242A;--muted:#967C82;--line:#F0DADC;--accent:#C06078;--accent2:#D89F8B;--soft:#F8E7E8}
  body{
    margin:0; padding:clamp(16px,4vw,48px); background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .3s,color .3s;
  }
  .wrap{max-width:1080px; margin:0 auto}
  header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px; justify-content:space-between; margin-bottom:10px}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
  h1{margin:0; font-size:clamp(24px,4.4vw,38px); letter-spacing:-.04em; line-height:1.15}
  .sub{margin:8px 0 0; color:var(--muted); font-size:13.5px; letter-spacing:-.01em; max-width:52ch; line-height:1.6}
  .themes{display:flex; gap:6px}
  .themes button{
    appearance:none; border:1px solid var(--line); background:var(--win); color:var(--muted); font:inherit;
    font-size:11.5px; padding:7px 12px; border-radius:99px; cursor:pointer; transition:all .18s; letter-spacing:-.01em;
  }
  .themes button:hover{color:var(--ink)}
  .themes button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  html[data-theme="navy"] .themes button.on{color:#0B1120}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; margin-top:26px}
  .card{
    background:var(--win); border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.06); display:flex; flex-direction:column;
  }
  .card .frame{border:0; width:100%; height:236px; display:block; background:transparent}
  .card .meta{padding:12px 16px 15px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
  .card h2{margin:0; font-size:14px; letter-spacing:-.02em}
  .card p{margin:0; font-size:11.5px; color:var(--muted); line-height:1.55; letter-spacing:-.01em}
  .row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:2px}
  .url{
    flex:1; min-width:0; font-size:10.5px; color:var(--muted); background:var(--soft); border-radius:6px;
    padding:5px 7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .copy{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-size:10.5px;
    padding:5px 9px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .copy:hover{border-color:var(--accent)}
  footer{margin-top:34px; color:var(--muted); font-size:11.5px; line-height:1.7; border-top:1px solid var(--line); padding-top:16px}
  code{background:var(--soft); padding:1px 5px; border-radius:4px; font-size:10.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Notion Embed Pack</div>
      <h1>미니멀 위젯 5종</h1>
      <p class="sub">노션 <code>/embed</code>에 URL만 붙이면 되는 단일 파일 위젯입니다. <code>?theme=cream|sage|navy|blush</code>로 톤을 맞추고, 제목·수치는 파라미터로 바꿉니다.</p>
    </div>
    <div class="themes" id="themes">
      <button data-t="cream" class="on">Cream</button>
      <button data-t="sage">Sage</button>
      <button data-t="navy">Navy</button>
      <button data-t="blush">Blush</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    권장 높이 — D-Day 240px · 타이머 280px · 매트릭스 420px · 게이지 240px · 시계 240px.<br>
    데이터는 브라우저 localStorage에 저장됩니다(같은 기기·같은 브라우저). 위젯마다 <code>key=</code> 파라미터로 저장 공간을 분리할 수 있습니다.
  </footer>
</div>
<script>
(function(){
  var BASE = location.pathname.replace(/index\.html$/, '');
  var W = [
    {f:'dday.html', n:'D-Day 카운터', d:'시험일·마감일까지 남은 날과 진행률. 오늘 날짜·시간 실시간 표시.', h:236, demo:'dday.html?title=건강운동관리사+필기&date=2027-05-15&start=2026-11-01'},
    {f:'pomodoro.html', n:'집중 타이머', d:'25/50분 포모도로, 오늘 완료 세션 카운터, 알림음·화이트노이즈.', h:280, demo:'pomodoro.html?title=집중+타이머', height:280},
    {f:'matrix.html', n:'4분면 포커스 보드', d:'드래그 앤 드롭 아이젠하워 매트릭스. 입력 후 Enter로 바로 추가.', h:420, demo:'matrix.html?title=오늘의+포커스'},
    {f:'gauge.html', n:'목표 달성률 게이지', d:'매출·예산·회독 목표 달성률을 원형+바로. 월 경과 대비 페이스까지.', h:236, demo:'gauge.html?label=11월+매출+목표&current=2200000&goal=3000000&unit=원'},
    {f:'clock-quote.html', n:'시계 · 오늘의 다짐', d:'플립 디지털 시계와 클릭해서 고치는 한 줄 다짐. 날마다 새로.', h:236, demo:'clock-quote.html?title=오늘의+다짐'}
  ];
  var grid = document.getElementById('grid');
  var theme = 'cream';

  function url(f, t){ return BASE + f + (f.indexOf('?') >= 0 ? '&' : '?') + 'theme=' + t; }

  W.forEach(function(w){
    var card = document.createElement('div');
    card.className = 'card';
    var short = BASE + w.f;
    card.innerHTML =
      '<iframe class="frame" loading="lazy" src="' + url(w.demo.split('#')[0], theme) + '" title="' + w.n + '"></iframe>' +
      '<div class="meta"><h2>' + w.n + '</h2><p>' + w.d + '</p>' +
      '<div class="row"><div class="url">' + location.origin + short + '</div>' +
      '<button class="copy">복사</button></div></div>';
    card.querySelector('iframe').style.height = (w.height || w.h) + 'px';
    card.querySelector('.copy').addEventListener('click', function(){
      var b = this;
      navigator.clipboard.writeText(location.origin + short).then(function(){
        b.textContent = '복사됨'; setTimeout(function(){ b.textContent = '복사'; }, 1400);
      });
    });
    grid.appendChild(card);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#themes button'), function(b){
    b.addEventListener('click', function(){
      theme = b.dataset.t;
      document.documentElement.setAttribute('data-theme', theme);
      Array.prototype.forEach.call(document.querySelectorAll('#themes button'), function(x){ x.classList.toggle('on', x === b); });
      Array.prototype.forEach.call(document.querySelectorAll('.card iframe'), function(f, i){
        var src = f.getAttribute('src').replace(/theme=[a-z]+/, 'theme=' + theme);
        f.setAttribute('src', src);
      });
    });
  });
})();
</script>
</body>
</html>
