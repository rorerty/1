<!doctype html>
<html lang="ko" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포커스 보드</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#F4EEE3; --win:#FFFDF8; --bar:#FAF4E8; --ink:#2A2721; --muted:#8A8376; --line:#EADFCD;
    --accent:#AD7949; --accent2:#6E8F6A; --soft:#F4EBDC; --shadow:0 12px 28px rgba(96,74,42,.13);
    --q1:#C0662F; --q2:#5E8C69; --q3:#C39540; --q4:#8C8578;
  }
  html[data-theme="sage"]{
    --bg:#E9EFE6; --win:#FDFEFB; --bar:#F2F7F0; --ink:#243026; --muted:#78897C; --line:#D9E5D7;
    --accent:#4F8261; --accent2:#8FB295; --soft:#E6F0E2; --shadow:0 12px 28px rgba(46,74,52,.14);
    --q1:#3E7A55; --q2:#7CA984; --q3:#B08A3E; --q4:#7E8A80;
  }
  html[data-theme="navy"]{
    --bg:#0C1220; --win:#141C2B; --bar:#19222F; --ink:#E9EEF7; --muted:#8492A8; --line:#27324A;
    --accent:#7FA1FF; --accent2:#45CEB0; --soft:#1D2739; --shadow:0 14px 32px rgba(0,0,0,.5);
    --q1:#7FA1FF; --q2:#45CEB0; --q3:#E0B463; --q4:#7A879C;
  }
  html[data-theme="blush"]{
    --bg:#FAEEEF; --win:#FFFCFC; --bar:#FDF2F3; --ink:#33242A; --muted:#967C82; --line:#F0DADC;
    --accent:#C06078; --accent2:#D89F8B; --soft:#F8E7E8; --shadow:0 12px 28px rgba(120,60,70,.14);
    --q1:#C06078; --q2:#D89F8B; --q3:#C79A54; --q4:#98838A;
  }
  html,body{height:100%;margin:0}
  body{
    display:flex; padding:clamp(4px,1.2vw,10px); background:transparent; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; font-size:14px;
  }
  .win{
    flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; border-radius:15px; background:var(--win);
    border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden;
  }
  .bar{
    flex:0 0 32px; height:32px; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:var(--bar); border-bottom:1px solid var(--line);
  }
  .lights{display:flex; gap:6px; flex:none}
  .lights i{display:block; width:9px; height:9px; border-radius:50%}
  .lights .r{background:#FF5F57} .lights .y{background:#FEBC2E} .lights .g{background:#28C840}
  .ttl{font-size:12.5px; font-weight:600; letter-spacing:-.01em; opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:50%}
  .spacer{flex:1}
  .prog{display:flex; align-items:center; gap:6px; flex:none}
  .prog .track{width:64px; height:4px; border-radius:3px; background:var(--line); overflow:hidden}
  .prog .fill{height:100%; width:0%; border-radius:3px; background:var(--accent); transition:width .25s}
  .prog .pct{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums}
  .date{font-size:11px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
  .addrow{display:flex; align-items:center; gap:6px; padding:7px max(10px, calc(50% - 500px)); border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--bar) 55%, var(--win))}
  .addrow input{
    flex:1; min-width:0; appearance:none; border:1px solid var(--line); background:var(--win); color:var(--ink);
    font:inherit; font-size:12px; padding:6px 10px; border-radius:8px; outline:none; letter-spacing:-.01em;
    transition:border-color .16s,box-shadow .16s;
  }
  .addrow input::placeholder{color:var(--muted); opacity:.85}
  .addrow input:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%, transparent)}
  .seg{display:flex; gap:3px; flex:none}
  .seg button{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted); font:inherit;
    width:22px; height:24px; border-radius:6px; font-size:10.5px; cursor:pointer; padding:0; font-weight:600;
    transition:all .15s;
  }
  .seg button.on{color:#fff; border-color:transparent}
  .seg button[data-q="q1"].on{background:var(--q1)} .seg button[data-q="q2"].on{background:var(--q2)}
  .seg button[data-q="q3"].on{background:var(--q3)} .seg button[data-q="q4"].on{background:var(--q4)}
  .grid{
    flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr);
    gap:6px; padding:7px 9px 9px; width:100%; max-width:1000px; margin:0 auto;
  }
  .quad{
    min-width:0; min-height:0; display:flex; flex-direction:column; border-radius:10px; overflow:hidden;
    background:color-mix(in srgb,var(--soft) 55%, var(--win)); border:1px solid var(--line);
    transition:border-color .16s, background .16s, transform .16s;
  }
  .quad.over{border-color:var(--accent); background:color-mix(in srgb,var(--soft) 100%, var(--win))}
  .qhead{display:flex; align-items:center; gap:5px; padding:5px 8px 2px; flex:none}
  .dot{width:7px; height:7px; border-radius:50%; flex:none}
  .q1 .dot{background:var(--q1)} .q2 .dot{background:var(--q2)} .q3 .dot{background:var(--q3)} .q4 .dot{background:var(--q4)}
  .qname{font-size:11px; font-weight:650; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .qsub{font-size:9.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; letter-spacing:-.01em}
  .qcount{font-size:9.5px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none}
  .list{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:2px 5px 5px; display:flex; flex-direction:column; gap:3px}
  .list::-webkit-scrollbar{width:4px}
  .list::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}
  .item{
    display:flex; align-items:center; gap:5px; padding:4px 6px; border-radius:7px; background:var(--win);
    border:1px solid color-mix(in srgb,var(--line) 70%, transparent); cursor:grab; font-size:11.5px;
    letter-spacing:-.01em; line-height:1.35; transition:opacity .16s, border-color .16s;
  }
  .item:active{cursor:grabbing}
  .item.drag{opacity:.35}
  .item .txt{flex:1; min-width:0; overflow-wrap:anywhere; cursor:text}
  .item.done .txt{text-decoration:line-through; color:var(--muted); opacity:.75}
  .item input[type=checkbox]{
    appearance:none; width:11px; height:11px; border-radius:4px; border:1.5px solid var(--line);
    flex:none; cursor:pointer; margin:0; position:relative; transition:all .15s;
  }
  .item input[type=checkbox]:checked{background:var(--accent2); border-color:var(--accent2)}
  .item input[type=checkbox]:checked::after{
    content:""; position:absolute; left:2.6px; top:.4px; width:3px; height:6px;
    border:solid var(--win); border-width:0 1.5px 1.5px 0; transform:rotate(40deg);
  }
  .move, .del{
    appearance:none; border:0; background:transparent; color:var(--muted); cursor:pointer;
    font-size:11px; line-height:1; padding:2px 1px; opacity:0; transition:opacity .15s,color .15s; flex:none;
  }
  .item:hover .move, .item:hover .del, .move:focus-visible, .del:focus-visible{opacity:.75}
  .move:hover{color:var(--accent)} .del:hover{color:var(--q1)}
  .empty{font-size:10px; color:var(--muted); opacity:.6; padding:5px 7px; letter-spacing:-.01em}
  @media (max-width:420px){
    .qsub{display:none}
    .item{font-size:11px; padding:3px 5px}
    .addrow input{font-size:11.5px}
    .prog .track{width:48px}
  }
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="ttl" id="ttl">오늘의 포커스 보드</div>
    <div class="spacer"></div>
    <div class="prog"><div class="track"><div class="fill" id="pfill"></div></div><span class="pct" id="ppct">0%</span></div>
    <div class="date" id="date"></div>
  </div>
  <div class="addrow">
    <input id="newtask" type="text" placeholder="할 일을 쓰고 Enter — 3초 만에 추가" autocomplete="off" maxlength="90">
    <div class="seg" id="seg">
      <button data-q="q1" class="on" title="긴급·중요">1</button>
      <button data-q="q2" title="중요·비긴급">2</button>
      <button data-q="q3" title="긴급·비중요">3</button>
      <button data-q="q4" title="나머지">4</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);

  /* ── 프리셋: ?preset=exam → 수험생용 기본 라벨·초기 태스크 ───────────── */
  var PRESETS = {
    exam: {
      title: '오늘의 학습 우선순위',
      labels: {q1:'긴급 · 중요', q2:'중요 · 비긴급', q3:'긴급 · 비중요', q4:'나머지'},
      subs:   {q1:'지금 바로', q2:'계획해서', q3:'빠르게 처리', q4:'오늘은 미루기'},
      tasks: [
        {q:'q1', text:'오늘 복습 예정 오답 3건 풀기'},
        {q:'q1', text:'시험 범위 마지막 단원 정리'},
        {q:'q2', text:'네트워크 서브넷 단원 2회독'},
        {q:'q2', text:'취약 과목 기출 20문제 풀기'},
        {q:'q3', text:'오답 1건 기록하고 복습 단계 올리기'},
        {q:'q4', text:'다음 모의고사 시간 재고 풀기'}
      ]
    }
  };
  var presetName = (q.get('preset') || '').toLowerCase();
  var preset = PRESETS[presetName] || null;

  var THEMES = ['cream','sage','navy','blush'];
  var theme = (q.get('theme') || 'cream').toLowerCase();
  document.documentElement.setAttribute('data-theme', THEMES.indexOf(theme) >= 0 ? theme : 'cream');

  var title = (q.get('title') || '').trim() || (preset ? preset.title : '오늘의 포커스 보드');
  document.getElementById('ttl').textContent = title;
  document.title = title;
  var slug = (q.get('key') || title).replace(/\s+/g, '-').toLowerCase();

  var QUADS = [
    {id:'q1', name:'긴급 · 중요', sub:'지금 바로'},
    {id:'q2', name:'중요 · 비긴급', sub:'계획해서'},
    {id:'q3', name:'긴급 · 비중요', sub:'빠르게 처리'},
    {id:'q4', name:'나머지', sub:'오늘은 미루기'}
  ];
  /* 라벨 커스터마이즈: ?labels=긴급;중요;급함;나중  /  ?subs=지금;계획;처리;미루기 */
  if (preset && preset.labels) QUADS.forEach(function(x, i){ x.name = preset.labels[x.id] || x.name; });
  if (preset && preset.subs)   QUADS.forEach(function(x){ x.sub = preset.subs[x.id] || x.sub; });
  var labels = (q.get('labels') || '').split(';');
  if (labels.length === 4 && labels.join('')) QUADS.forEach(function(x, i){ if(labels[i].trim()) x.name = labels[i].trim(); });
  var subs = (q.get('subs') || '').split(';');
  if (subs.length === 4 && subs.join('')) QUADS.forEach(function(x, i){ if(subs[i].trim()) x.sub = subs[i].trim(); });

  var WD = ['일','월','화','수','목','금','토'];
  var n = new Date();
  document.getElementById('date').textContent = (n.getMonth()+1) + '/' + n.getDate() + ' (' + WD[n.getDay()] + ')';

  var KEY = 'mx:' + slug;
  var items = [];
  function parseTasks(s){
    var out = [];
    String(s || '').split(';').forEach(function(chunk){
      var t = chunk.trim(); if(!t) return;
      var m = t.match(/^(q[1-4])\s*[:|]\s*(.+)$/i);
      if(m) out.push({q: m[1].toLowerCase(), text: m[2].trim()});
      else out.push({q: 'q1', text: t});
    });
    return out;
  }
  function seedTasks(){
    var fromUrl = parseTasks(q.get('tasks'));
    if(fromUrl.length) return fromUrl;
    if(preset && preset.tasks) return preset.tasks.slice();
    return [
      {text:'오늘 반드시 끝낼 한 가지', q:'q1'},
      {text:'이번 주 목표로 이어지는 일', q:'q2'},
      {text:'5분 안에 처리할 연락', q:'q3'}
    ];
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr)) items = arr.filter(function(x){ return x && typeof x.text === 'string'; });
      }
    }catch(e){}
    if(!items.length){
      items = seedTasks().map(function(t, i){
        return {id:'s' + (i+1), text: t.text, q: t.q || 'q1', done:false};
      });
    }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }

  var grid = document.getElementById('grid');
  var lists = {};
  QUADS.forEach(function(quad){
    var el = document.createElement('section');
    el.className = 'quad ' + quad.id;
    el.innerHTML =
      '<div class="qhead"><span class="dot"></span><span class="qname"></span>' +
      '<span class="qsub"></span><span class="qcount" data-count></span></div>' +
      '<div class="list" data-list></div>';
    el.querySelector('.qname').textContent = quad.name;
    el.querySelector('.qsub').textContent = quad.sub;
    grid.appendChild(el);
    lists[quad.id] = el.querySelector('[data-list]');

    el.addEventListener('dragover', function(e){ e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', function(e){ if(!el.contains(e.relatedTarget)) el.classList.remove('over'); });
    el.addEventListener('drop', function(e){
      e.preventDefault(); el.classList.remove('over');
      var id = e.dataTransfer.getData('text/plain');
      moveItem(id, quad.id);
    });
  });

  var targetQ = 'q1';
  Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function(b){
    b.addEventListener('click', function(){
      targetQ = b.dataset.q;
      Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function(x){ x.classList.toggle('on', x === b); });
      document.getElementById('newtask').focus();
    });
  });

  function uid(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function paintProgress(){
    var total = items.length;
    var done = items.filter(function(x){ return x.done; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('pfill').style.width = pct + '%';
    document.getElementById('ppct').textContent = total ? (done + '/' + total + ' ' + pct + '%') : '0%';
    document.getElementById('ppct').title = total ? (total + '개 중 ' + done + '개 완료') : '할 일을 추가해 보세요';
  }

  function render(){
    QUADS.forEach(function(quad){
      var list = lists[quad.id];
      var rows = items.filter(function(it){ return it.q === quad.id; });
      list.innerHTML = '';
      if(!rows.length){
        var e = document.createElement('div');
        e.className = 'empty';
        e.textContent = '드래그해서 옮기기';
        list.appendChild(e);
      }
      rows.forEach(function(it){
        var row = document.createElement('div');
        row.className = 'item' + (it.done ? ' done' : '');
        row.draggable = true;
        row.dataset.id = it.id;

        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = !!it.done; cb.title = '완료';
        cb.addEventListener('change', function(){ it.done = cb.checked; save(); render(); });

        var txt = document.createElement('span');
        txt.className = 'txt'; txt.textContent = it.text; txt.title = '더블클릭해서 수정';
        txt.addEventListener('dblclick', function(){
          txt.contentEditable = 'true'; txt.focus();
          var r = document.createRange(); r.selectNodeContents(txt);
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        });
        txt.addEventListener('blur', function(){
          if(txt.contentEditable !== 'true') return;
          txt.contentEditable = 'false';
          var v = txt.textContent.replace(/\s+/g,' ').trim();
          if(!v){ items = items.filter(function(x){ return x.id !== it.id; }); }
          else { it.text = v.slice(0,90); }
          save(); render();
        });
        txt.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ e.preventDefault(); txt.blur(); }
          if(e.key === 'Escape'){ txt.textContent = it.text; txt.blur(); }
        });

        var mv = document.createElement('button');
        mv.className = 'move'; mv.textContent = '⇄'; mv.title = '다음 칸으로 이동';
        mv.addEventListener('click', function(){
          var order = ['q1','q2','q3','q4'];
          var idx = order.indexOf(it.q);
          it.q = order[(idx+1) % 4]; save(); render();
        });
        var del = document.createElement('button');
        del.className = 'del'; del.textContent = '×'; del.title = '삭제';
        del.addEventListener('click', function(){ items = items.filter(function(x){ return x.id !== it.id; }); save(); render(); });

        row.appendChild(cb); row.appendChild(txt); row.appendChild(mv); row.appendChild(del);
        row.addEventListener('dragstart', function(e){
          e.dataTransfer.setData('text/plain', it.id);
          e.dataTransfer.effectAllowed = 'move';
          row.classList.add('drag');
          window.__dragId = it.id;
        });
        row.addEventListener('dragend', function(){ row.classList.remove('drag'); window.__dragId = null; });
        list.appendChild(row);
      });
      var cEl = grid.querySelector('.' + quad.id + ' [data-count]');
      var open = rows.filter(function(r){ return !r.done; }).length;
      cEl.textContent = rows.length ? (open + '/' + rows.length) : '';
    });
    paintProgress();
  }

  function moveItem(id, to){
    id = id || window.__dragId;
    var it = items.filter(function(x){ return x.id === id; })[0];
    if(!it || it.q === to) return;
    it.q = to; save(); render();
  }

  var input = document.getElementById('newtask');
  input.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var v = input.value.replace(/\s+/g,' ').trim();
    if(!v) return;
    items.push({id:uid(), text:v.slice(0,90), q:targetQ, done:false});
    input.value = '';
    save(); render();
  });

  load(); save(); render();

  window.addEventListener('storage', function(e){ if(e.key === KEY){ load(); render(); } });
})();
</script>
</body>
</html>
