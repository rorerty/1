<!doctype html>
<html lang="ko" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>목표 달성률</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#F4EEE3; --win:#FFFDF8; --bar:#FAF4E8; --ink:#2A2721; --muted:#8A8376; --line:#EADFCD;
    --accent:#AD7949; --accent2:#6E8F6A; --soft:#F4EBDC; --shadow:0 12px 28px rgba(96,74,42,.13);
    --warn:#C0522F;
  }
  html[data-theme="sage"]{
    --bg:#E9EFE6; --win:#FDFEFB; --bar:#F2F7F0; --ink:#243026; --muted:#78897C; --line:#D9E5D7;
    --accent:#4F8261; --accent2:#8FB295; --soft:#E6F0E2; --shadow:0 12px 28px rgba(46,74,52,.14);
    --warn:#B4632F;
  }
  html[data-theme="navy"]{
    --bg:#0C1220; --win:#141C2B; --bar:#19222F; --ink:#E9EEF7; --muted:#8492A8; --line:#27324A;
    --accent:#7FA1FF; --accent2:#45CEB0; --soft:#1D2739; --shadow:0 14px 32px rgba(0,0,0,.5);
    --warn:#FF8A6B;
  }
  html[data-theme="blush"]{
    --bg:#FAEEEF; --win:#FFFCFC; --bar:#FDF2F3; --ink:#33242A; --muted:#967C82; --line:#F0DADC;
    --accent:#C06078; --accent2:#D89F8B; --soft:#F8E7E8; --shadow:0 12px 28px rgba(120,60,70,.14);
    --warn:#C06078;
  }
  html,body{height:100%;margin:0}
  body{
    display:flex; padding:clamp(5px,1.6vw,13px); background:transparent; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; font-size:14px;
  }
  .win{
    flex:1; min-width:0; display:flex; flex-direction:column; border-radius:15px; background:var(--win);
    border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden;
  }
  .bar{
    flex:0 0 34px; height:34px; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:var(--bar); border-bottom:1px solid var(--line);
  }
  .lights{display:flex; gap:6px; flex:none}
  .lights i{display:block; width:9px; height:9px; border-radius:50%}
  .lights .r{background:#FF5F57} .lights .y{background:#FEBC2E} .lights .g{background:#28C840}
  .ttl{font-size:12.5px; font-weight:600; letter-spacing:-.01em; opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .spacer{flex:1}
  .stamp{font-size:10.5px; color:var(--muted); white-space:nowrap; letter-spacing:.01em}
  main{
    flex:1; min-height:0; display:flex; align-items:center; gap:clamp(10px,3.4vw,24px);
    padding:clamp(8px,2.8vw,18px) clamp(10px,3vw,20px); flex-wrap:wrap;
  }
  .ringwrap{position:relative; flex:0 0 auto; width:clamp(104px,26vw,140px); aspect-ratio:1; margin:0 auto}
  svg{width:100%; height:100%; transform:rotate(-90deg); display:block}
  .rbg{fill:none; stroke:var(--soft); stroke-width:9}
  .rfg{
    fill:none; stroke:url(#g); stroke-width:9; stroke-linecap:round;
    stroke-dasharray:326.73; stroke-dashoffset:326.73; transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);
  }
  .rcap{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .pct{font-size:clamp(21px,5.6vw,29px); font-weight:750; letter-spacing:-.045em; font-variant-numeric:tabular-nums; line-height:1}
  .pct small{font-size:12px; font-weight:600; letter-spacing:0; margin-left:1px; opacity:.7}
  .caplbl{font-size:10px; color:var(--muted); letter-spacing:.02em}
  .info{flex:1 1 190px; min-width:0; display:flex; flex-direction:column; gap:9px}
  .label{font-size:13px; font-weight:650; letter-spacing:-.02em; line-height:1.3; overflow-wrap:anywhere}
  .nums{display:flex; align-items:baseline; gap:4px; flex-wrap:wrap; letter-spacing:-.01em}
  .cur{font-size:clamp(17px,4.6vw,22px); font-weight:750; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .of{font-size:11.5px; color:var(--muted)}
  .goal{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .track{position:relative; height:8px; border-radius:99px; background:var(--soft); overflow:hidden}
  .fill{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .fill.over{background:linear-gradient(90deg,var(--accent),var(--warn))}
  .foot{display:flex; flex-wrap:wrap; gap:2px 8px; font-size:10.5px; color:var(--muted); letter-spacing:-.01em; line-height:1.5}
  .foot>span{white-space:nowrap}
  .foot b{color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums}
  .foot .warnb{color:var(--warn)}
  @media (prefers-reduced-motion:reduce){ .rfg,.fill{transition:none} }
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="ttl" id="ttl">목표 달성률</div>
    <div class="spacer"></div>
    <div class="stamp" id="stamp"></div>
  </div>
  <main>
    <div class="ringwrap">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent2)"/>
            <stop offset="100%" stop-color="var(--accent)"/>
          </linearGradient>
        </defs>
        <circle class="rbg" cx="60" cy="60" r="52"/>
        <circle class="rfg" id="rfg" cx="60" cy="60" r="52"/>
      </svg>
      <div class="rcap">
        <div class="pct" id="pct">0<small>%</small></div>
        <div class="caplbl">달성률</div>
      </div>
    </div>
    <div class="info">
      <div class="label" id="label">11월 매출 목표</div>
      <div class="nums">
        <span class="cur" id="cur">0원</span>
        <span class="of">/</span>
        <span class="goal" id="goal">0원</span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="foot"><span id="remain">목표까지 —</span><span id="pace"></span></div>
    </div>
  </main>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var THEMES = ['cream','sage','navy','blush'];
  var theme = (q.get('theme') || 'cream').toLowerCase();
  document.documentElement.setAttribute('data-theme', THEMES.indexOf(theme) >= 0 ? theme : 'cream');

  var label = (q.get('label') || q.get('title') || '목표 달성률').trim();
  var unit = q.get('unit') || '';
  var current = num(q.get('current'));
  var goal = num(q.get('goal'));

  function num(v){
    if(v === null) return 0;
    var n = parseFloat(String(v).replace(/[,\s_]/g, ''));
    return isFinite(n) ? n : 0;
  }
  function fmt(v){
    var neg = v < 0; v = Math.abs(v);
    var r = Math.round(v * 10) / 10;
    var s = (r % 1 === 0) ? String(Math.round(r)) : r.toFixed(1);
    s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + s;
  }
  function money(v, u){
    if(!u) return fmt(v);
    if(u === '%') return fmt(v) + '%';
    if(/^(원|₩|krw)$/i.test(u)) return fmt(v) + '원';
    return fmt(v) + u;
  }

  document.getElementById('ttl').textContent = label;
  document.getElementById('label').textContent = label;
  document.title = label;

  document.getElementById('cur').textContent = money(current, unit);
  document.getElementById('goal').textContent = goal ? '/ ' + money(goal, unit) : '/ 목표 없음';

  var pct = goal > 0 ? (current / goal * 100) : 0;
  var shown = Math.max(0, pct);
  var clamped = Math.min(100, shown);

  document.getElementById('pct').innerHTML = (shown >= 10 ? fmt(Math.round(shown)) : fmt(Math.round(shown*10)/10)) + '<small>%</small>';
  if(shown > 100) document.getElementById('pct').style.color = 'var(--warn)';
  var fill = document.getElementById('fill');
  if(shown > 100) fill.classList.add('over');
  requestAnimationFrame(function(){ fill.style.width = clamped.toFixed(2) + '%'; });
  document.getElementById('rfg').style.strokeDashoffset = (326.73 * (1 - clamped/100)).toFixed(2);

  var remainEl = document.getElementById('remain');
  if(goal > 0 && current >= goal){
    var over = current - goal;
    remainEl.innerHTML = '<b class="warnb">목표 초과 ' + money(over, unit) + '</b>';
  } else if(goal > 0){
    remainEl.innerHTML = '목표까지 <b>' + money(goal - current, unit) + '</b>';
  } else {
    remainEl.textContent = '목표값을 넣어 주세요';
  }

  var n = new Date();
  var last = new Date(n.getFullYear(), n.getMonth()+1, 0).getDate();
  var dayRatio = n.getDate() / last * 100;
  var paceEl = document.getElementById('pace');
  if(goal > 0){
    var diff = shown - dayRatio;
    paceEl.innerHTML = '월 ' + Math.round(dayRatio) + '% 경과 · ' +
      (diff >= 0 ? '<b>+' + Math.round(diff) + 'p 앞섬</b>' : '<b>' + Math.round(diff) + 'p 뒤처짐</b>');
  } else {
    paceEl.textContent = '';
  }
  document.getElementById('stamp').textContent = (n.getMonth()+1) + '월 ' + n.getDate() + '일 기준';
})();
</script>
</body>
</html>
