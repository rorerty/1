<!doctype html>
<html lang="ko" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포모도로</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#F4EEE3; --win:#FFFDF8; --bar:#FAF4E8; --ink:#2A2721; --muted:#8A8376; --line:#EADFCD;
    --accent:#AD7949; --accent2:#6E8F6A; --soft:#F4EBDC; --shadow:0 12px 28px rgba(96,74,42,.13);
  }
  html[data-theme="sage"]{
    --bg:#E9EFE6; --win:#FDFEFB; --bar:#F2F7F0; --ink:#243026; --muted:#78897C; --line:#D9E5D7;
    --accent:#4F8261; --accent2:#8FB295; --soft:#E6F0E2; --shadow:0 12px 28px rgba(46,74,52,.14);
  }
  html[data-theme="navy"]{
    --bg:#0C1220; --win:#141C2B; --bar:#19222F; --ink:#E9EEF7; --muted:#8492A8; --line:#27324A;
    --accent:#7FA1FF; --accent2:#45CEB0; --soft:#1D2739; --shadow:0 14px 32px rgba(0,0,0,.5);
  }
  html[data-theme="blush"]{
    --bg:#FAEEEF; --win:#FFFCFC; --bar:#FDF2F3; --ink:#33242A; --muted:#967C82; --line:#F0DADC;
    --accent:#C06078; --accent2:#D89F8B; --soft:#F8E7E8; --shadow:0 12px 28px rgba(120,60,70,.14);
  }
  html,body{height:100%;margin:0}
  body{
    display:flex; padding:clamp(5px,1.6vw,13px); background:transparent; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; font-size:14px;
  }
  .win{
    flex:1; min-width:0; display:flex; flex-direction:column; border-radius:15px; background:var(--win);
    border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden;
  }
  .bar{
    flex:0 0 34px; height:34px; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:var(--bar); border-bottom:1px solid var(--line);
  }
  .lights{display:flex; gap:6px; flex:none}
  .lights i{display:block; width:9px; height:9px; border-radius:50%}
  .lights .r{background:#FF5F57} .lights .y{background:#FEBC2E} .lights .g{background:#28C840}
  .ttl{
    font-size:12.5px; font-weight:600; letter-spacing:-.01em; opacity:.82; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:52%;
  }
  .spacer{flex:1}
  .todaybadge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--muted);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .todaybadge b{color:var(--ink); font-weight:650}
  main{
    flex:1; min-height:0; display:flex; align-items:center; gap:clamp(10px,3.4vw,26px);
    padding:clamp(8px,2.6vw,18px) clamp(10px,3vw,20px); flex-wrap:wrap;
  }
  .ringwrap{position:relative; flex:0 0 auto; width:clamp(108px,26vw,148px); aspect-ratio:1; margin:0 auto}
  svg{width:100%; height:100%; transform:rotate(-90deg); display:block}
  .rbg{fill:none; stroke:var(--soft); stroke-width:7}
  .rfg{
    fill:none; stroke:url(#g); stroke-width:7; stroke-linecap:round;
    stroke-dasharray:326.73; stroke-dashoffset:326.73; transition:stroke-dashoffset .4s linear;
  }
  .ringtext{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .time{
    font-size:clamp(22px,6vw,31px); font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .modelbl{font-size:10.5px; color:var(--muted); letter-spacing:-.01em; white-space:nowrap}
  .ctrl{flex:1 1 190px; min-width:0; display:flex; flex-direction:column; gap:9px}
  .modes{display:flex; gap:5px; flex-wrap:wrap}
  .m{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted);
    font:inherit; font-size:11.5px; padding:5px 9px; border-radius:8px; cursor:pointer;
    letter-spacing:-.01em; transition:background .16s,color .16s,border-color .16s; white-space:nowrap;
  }
  .m:hover{border-color:var(--accent); color:var(--ink)}
  .m.active{background:var(--soft); border-color:transparent; color:var(--ink); font-weight:650}
  .btns{display:flex; align-items:center; gap:6px}
  button{font-family:inherit; cursor:pointer}
  .primary{
    appearance:none; border:0; border-radius:9px; padding:8px 16px; font-size:12.5px; font-weight:650; letter-spacing:-.01em;
    color:#fff; background:var(--accent); background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 78%, #000));
    box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 32%, transparent); transition:transform .12s,filter .16s;
  }
  html[data-theme="navy"] .primary{color:#0B1120}
  .primary:active{transform:translateY(1px)}
  .primary.pause{background:var(--soft); color:var(--ink); box-shadow:none; border:1px solid var(--line)}
  .ghost{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted);
    width:32px; height:32px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;
    transition:color .16s,border-color .16s,background .16s; padding:0;
  }
  .ghost:hover{color:var(--ink); border-color:var(--accent)}
  .ghost[aria-pressed="true"]{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%, var(--line)); background:var(--soft)}
  .ghost svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .stats{display:flex; align-items:baseline; gap:5px; font-size:11.5px; color:var(--muted); letter-spacing:-.01em}
  .stats b{color:var(--ink); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
  .dots{display:flex; gap:4px; flex-wrap:wrap}
  .dots i{width:7px; height:7px; border-radius:50%; background:var(--soft); border:1px solid var(--line)}
  .dots i.on{background:var(--accent); border-color:transparent}
  .toast{
    position:absolute; left:50%; bottom:10px; transform:translate(-50%,14px); opacity:0; pointer-events:none;
    background:var(--ink); color:var(--win); font-size:11.5px; padding:6px 12px; border-radius:99px;
    transition:opacity .25s,transform .25s; white-space:nowrap; z-index:3;
  }
  .toast.show{opacity:.94; transform:translate(-50%,0)}
  @media (max-width:360px){ .ghost:nth-of-type(4){display:none} }
  @media (prefers-reduced-motion:reduce){ .rfg{transition:none} }
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="ttl" id="ttl">집중 타이머</div>
    <div class="spacer"></div>
    <div class="todaybadge">오늘 <b id="badge">0</b>세션</div>
  </div>
  <main>
    <div class="ringwrap">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent2)"/>
            <stop offset="100%" stop-color="var(--accent)"/>
          </linearGradient>
        </defs>
        <circle class="rbg" cx="60" cy="60" r="52"/>
        <circle class="rfg" id="rfg" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ringtext">
        <div class="time" id="time">25:00</div>
        <div class="modelbl" id="modelbl">집중 25분</div>
      </div>
    </div>
    <div class="ctrl">
      <div class="modes">
        <button class="m active" data-min="25" data-break="0">25분</button>
        <button class="m" data-min="50" data-break="0">50분</button>
        <button class="m" data-min="5" data-break="1">휴식 5분</button>
      </div>
      <div class="btns">
        <button class="primary" id="start">시작</button>
        <button class="ghost" id="reset" title="초기화" aria-label="초기화">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4.5V10h5.5"/></svg>
        </button>
        <button class="ghost" id="snd" title="완료 알림음" aria-label="완료 알림음" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5a4 4 0 0 1 0 5"/></svg>
        </button>
        <button class="ghost" id="noise" title="화이트노이즈" aria-label="화이트노이즈" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg>
        </button>
      </div>
      <div class="stats"><span>오늘</span><b id="cnt">0</b><span>세션 ·</span><b id="mins">0</b><span>분 집중</span></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var THEMES = ['cream','sage','navy','blush'];
  var theme = (q.get('theme') || 'cream').toLowerCase();
  document.documentElement.setAttribute('data-theme', THEMES.indexOf(theme) >= 0 ? theme : 'cream');
  var title = (q.get('title') || '').trim() || '집중 타이머';
  document.getElementById('ttl').textContent = title;
  document.title = title;

  var slug = (q.get('key') || title).replace(/\s+/g, '-').toLowerCase();

  function ymdKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function load(){
    var t = {s:0, m:0};
    try{
      var raw = localStorage.getItem('pm:' + slug + ':' + ymdKey());
      if(raw){ var o = JSON.parse(raw); t.s = +o.s || 0; t.m = +o.m || 0; }
    }catch(e){}
    return t;
  }
  function save(){ try{ localStorage.setItem('pm:' + slug + ':' + ymdKey(), JSON.stringify(todayStats)); }catch(e){} }

  var todayStats = load();
  var DOTS = 10;
  var dotsEl = document.getElementById('dots');
  for(var i=0;i<DOTS;i++){ dotsEl.appendChild(document.createElement('i')); }
  function paintStats(){
    document.getElementById('cnt').textContent = todayStats.s;
    document.getElementById('mins').textContent = todayStats.m;
    document.getElementById('badge').textContent = todayStats.s;
    var dots = dotsEl.children;
    for(var i=0;i<dots.length;i++){
      dots[i].className = i < Math.min(todayStats.s, DOTS) ? 'on' : '';
    }
  }

  var selMin = 25, isBreak = false;
  var total = selMin * 60000;
  var left = total;
  var running = false;
  var endAt = 0;
  var timer = null;

  var timeEl = document.getElementById('time');
  var modeEl = document.getElementById('modelbl');
  var ring = document.getElementById('rfg');
  var startBtn = document.getElementById('start');
  var C = 326.73;

  function fmt(ms){
    ms = Math.max(0, ms);
    var s = Math.ceil(ms/1000);
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }
  function paint(){
    timeEl.textContent = fmt(left);
    var p = total > 0 ? 1 - left/total : 0;
    ring.style.strokeDashoffset = (C * (1 - Math.min(1, Math.max(0, p)))).toFixed(2);
    document.title = (running ? '▶ ' : '') + fmt(left) + ' · ' + title;
  }
  function setMode(min, brk){
    selMin = min; isBreak = brk; total = min*60000; left = total; running = false;
    if(timer){ clearInterval(timer); timer = null; }
    startBtn.textContent = '시작'; startBtn.classList.remove('pause');
    modeEl.textContent = (brk ? '휴식 ' : '집중 ') + min + '분';
    Array.prototype.forEach.call(document.querySelectorAll('.m'), function(b){
      b.classList.toggle('active', +b.dataset.min === min && +b.dataset.break === (brk?1:0));
    });
    paint();
  }
  function step(){
    left = endAt - Date.now();
    if(left <= 0){ left = 0; paint(); finish(); return; }
    paint();
  }
  function startTimer(){
    if(left <= 0) left = total;
    endAt = Date.now() + left;
    running = true;
    timer = setInterval(step, 200);
    startBtn.textContent = '일시정지';
    startBtn.classList.add('pause');
    paint();
  }
  function pauseTimer(){
    running = false;
    if(timer){ clearInterval(timer); timer = null; }
    startBtn.textContent = '계속';
    startBtn.classList.remove('pause');
    paint();
  }
  function finish(){
    running = false;
    if(timer){ clearInterval(timer); timer = null; }
    startBtn.textContent = '시작';
    startBtn.classList.remove('pause');
    if(!isBreak){
      todayStats.s += 1;
      todayStats.m += selMin;
      save();
      paintStats();
      toast('집중 완료 · ' + selMin + '분 1세션 기록');
    } else {
      toast('휴식 끝 · 다시 집중해 볼까요');
    }
    if(soundOn) beep();
    var keep = total;
    setTimeout(function(){
      if(running) return;
      left = keep; paint();
    }, 1800);
  }
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  /* ---- audio ---- */
  var soundOn = true;
  var ac = null, noiseSrc = null, noiseGain = null, noiseOn = false;
  function ctx(){
    if(!ac){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ac = new AC();
    }
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }
  function beep(){
    var a = ctx(); if(!a) return;
    [0, 0.22, 0.44].forEach(function(t, i){
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1046.5 : 880;
      var t0 = a.currentTime + t;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + 0.2);
    });
  }
  function buildNoise(){
    var a = ctx(); if(!a) return false;
    if(noiseSrc) return true;
    var len = a.sampleRate * 2;
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    var b0=0,b1=0,b2=0;
    for(var i=0;i<len;i++){
      var w = Math.random()*2-1;
      b0 = 0.99765*b0 + w*0.0990460;
      b1 = 0.96300*b1 + w*0.2965164;
      b2 = 0.57000*b2 + w*1.0526913;
      d[i] = (b0+b1+b2+w*0.1848) * 0.11;
    }
    noiseSrc = a.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
    var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
    noiseGain = a.createGain(); noiseGain.gain.value = 0;
    noiseSrc.connect(lp).connect(noiseGain).connect(a.destination);
    noiseSrc.start();
    return true;
  }
  function toggleNoise(){
    if(!buildNoise()) { toast('이 브라우저에서는 소리를 쓸 수 없어요'); return; }
    noiseOn = !noiseOn;
    var a = ctx();
    noiseGain.gain.cancelScheduledValues(a.currentTime);
    noiseGain.gain.setTargetAtTime(noiseOn ? 0.5 : 0, a.currentTime, 0.25);
    var b = document.getElementById('noise');
    b.setAttribute('aria-pressed', noiseOn ? 'true' : 'false');
    toast(noiseOn ? '화이트노이즈 켜짐 · 집중 모드' : '화이트노이즈 꺼짐');
  }

  /* ---- events ---- */
  startBtn.addEventListener('click', function(){ running ? pauseTimer() : startTimer(); });
  document.getElementById('reset').addEventListener('click', function(){ setMode(selMin, isBreak); });
  document.getElementById('snd').addEventListener('click', function(){
    soundOn = !soundOn;
    this.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if(soundOn) beep();
  });
  document.getElementById('noise').addEventListener('click', toggleNoise);
  Array.prototype.forEach.call(document.querySelectorAll('.m'), function(b){
    b.addEventListener('click', function(){
      setMode(+b.dataset.min, b.dataset.break === '1');
    });
  });
  document.addEventListener('keydown', function(e){
    if(e.key === ' ' && e.target === document.body){
      e.preventDefault(); running ? pauseTimer() : startTimer();
    }
  });

  paintStats();
  setMode(25, false);
})();
</script>
</body>
</html>
